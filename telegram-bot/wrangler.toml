name = "kim-ne-yedi-bot"
main = "worker.js"
compatibility_date = "2024-01-01"

# Ortam Değişkenleri (Cloudflare Dashboard > Settings > Variables üzerinden Secret olarak eklenir):
# TELEGRAM_BOT_TOKEN
# GITHUB_TOKEN
# GEMINI_API_KEY
# ALLOWED_CHAT_ID (opsiyonel)


# Cloudflare cron saatleri UTC'dir: 09.00 UTC = 12.00 Europe/Istanbul.
[triggers]
crons = ["0 9 * * *"]
